default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
        # CHANGELOG.md è generato da git-cliff (cliff.toml) e finisce con righe vuote: non si
        # modifica a mano.
        exclude: ^CHANGELOG\.md$
      - id: trailing-whitespace
        # Gli snapshot syrupy contengono l'output delle tabelle Rich, spazi di padding compresi:
        # toglierli rompe i confronti.
        exclude: \.ambr$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        args: [--strict]
        files: ^src/
        additional_dependencies:
          - httpx
          - pydantic>=2.13.5
          - pydantic-settings
          - structlog
          - platformdirs
          - tomlkit
          - PyJWT
          - cryptography
          - typer
          - rich
          - ruamel.yaml

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
