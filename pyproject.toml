[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pynteracta"
description = "Unofficial third-party Python client (library + CLI) for the Interacta platform."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Simone Dalla" }]
keywords = ["interacta", "api", "client", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
    "httpx",
    "pydantic>=2",
    "pydantic-settings",
    "typer",
    "rich",
    "structlog",
    "platformdirs",
    "tomlkit",
]

[project.urls]
Homepage = "https://gitlab.com/pynteracta/pynteracta"
Repository = "https://gitlab.com/pynteracta/pynteracta"

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "respx",
]

[tool.hatch.version]
path = "src/pynteracta/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pynteracta"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["src/pynteracta/models/generated"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT", "PL"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_any_generics = true
warn_return_any = true

[[tool.mypy.overrides]]
module = "pynteracta.models.generated.*"
ignore_errors = true

[tool.coverage.run]
source = ["src/pynteracta"]
omit = ["src/pynteracta/models/generated/*"]

[tool.coverage.report]
fail_under = 85

[tool.pytest.ini_options]
markers = [
    "contract: validates generated models against the pinned swagger snapshot",
    "integration: hits a real tenant read-only (opt-in)",
]
