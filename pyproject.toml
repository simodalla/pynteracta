[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pynteracta"
description = "Unofficial third-party Python client (library + CLI) for the Interacta platform."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Simone Dalla" }]
keywords = ["interacta", "api", "client", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "httpx",
    "pydantic>=2",
    "pydantic-settings",
    "typer",
    "rich",
    "structlog",
    "platformdirs",
    "tomlkit>=0.15.0",
    "pyjwt>=2.13.0",
    "cryptography>=48.0.0",
]

[project.scripts]
pynteracta = "pynteracta.cli:app"

[project.optional-dependencies]
yaml = ["ruamel.yaml>=0.18"]
parquet = ["pyarrow>=18"]
export = ["ruamel.yaml>=0.18", "pyarrow>=18"]

[project.urls]
Homepage = "https://github.com/simodalla/pynteracta"
Repository = "https://github.com/simodalla/pynteracta"

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "respx",
    "syrupy",
    "datamodel-code-generator>=0.59.0",
    "mkdocs-material>=9",
    "mkdocstrings[python]>=1.0.6",
    "python-semantic-release>=9",
    "ruamel.yaml>=0.18",
    "pyarrow>=18",
]

[tool.hatch.version]
path = "src/pynteracta/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pynteracta"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["src/pynteracta/models/generated"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT", "PL"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_any_generics = true
warn_return_any = true

[[tool.mypy.overrides]]
module = "pynteracta.models.generated.*"
ignore_errors = true

[tool.coverage.run]
source = ["src/pynteracta"]
omit = ["src/pynteracta/models/generated/*"]

[tool.coverage.report]
fail_under = 85

[tool.pytest.ini_options]
pythonpath = ["tests/unit"]
markers = [
    "contract: validates generated models against the pinned swagger snapshot",
    "integration: hits a real tenant read-only (opt-in)",
]

[tool.semantic_release]
version_toml = []
version_variables = ["src/pynteracta/__init__.py:__version__"]
changelog_file = "CHANGELOG.md"
upload_to_pypi = false
upload_to_release = false
build_command = "uv build"
tag_format = "v{version}"
commit_parser = "conventional"
major_on_zero = false
allow_zero_version = true

[tool.semantic_release.branches.main]
match = "(main|feature_.*)"
prerelease = false

[tool.semantic_release.changelog.default_templates.changelog_sections]
Features = ["feat"]
"Bug Fixes" = ["fix"]
Performance = ["perf"]
Refactors = ["refactor"]
Documentation = ["docs"]
Build = ["build"]
CI = ["ci"]
Chores = ["chore", "test"]
