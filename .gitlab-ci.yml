# tags: [pynteracta-runner]   # TODO: set self-hosted runner tag (Q11)
# image: ${CI_REGISTRY}/python:3.12-slim   # TODO: set registry image (Q11)

stages: [lint, type, test, build, docs]

variables:
  UV_CACHE_DIR: .uv-cache

.default-rules:
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_MERGE_REQUEST_IID

lint:
  stage: lint
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_MERGE_REQUEST_IID
  script:
    - pip install uv && uv sync --frozen
    - uv run ruff check .
    - uv run ruff format --check .

type-check:
  stage: type
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_MERGE_REQUEST_IID
  script:
    - uv sync --frozen
    - uv run mypy src

test-unit:
  stage: test
  parallel:
    matrix:
      - PY: ["3.12", "3.13"]
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_MERGE_REQUEST_IID
  script:
    - uv sync --frozen --python ${PY}
    - uv run pytest -m "not integration and not contract" --cov --cov-report=xml --cov-fail-under=85
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

test-contract:
  stage: test
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_MERGE_REQUEST_IID
  script:
    - uv sync --frozen
    - uv run pytest -m contract

build:
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_MERGE_REQUEST_IID
  script:
    - uv sync --frozen
    - uv build
  artifacts:
    paths:
      - dist/*.whl
      - dist/*.tar.gz
    expire_in: 1 year

docs:
  stage: docs
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_MERGE_REQUEST_IID
  script:
    - uv sync --frozen
    - uv run mkdocs build --strict
  artifacts:
    paths:
      - site/
    expire_in: 1 week
